<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ganeshGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="tilakRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crown (Mukut) -->
  <path d="M35 24 L50 6 L65 24 L58 27 L50 16 L42 27 Z" fill="url(#ganeshGold)" filter="url(#shadow)"/>
  <circle cx="50" cy="11" r="3" fill="#D50000"/>
  <path d="M37 26 C43 23 57 23 63 26 C63 29 37 29 37 26 Z" fill="url(#ganeshGold)"/>

  <!-- Left Ear (Large Supa-like ear) -->
  <path d="M37 32 C22 28 14 38 18 52 C21 62 30 65 37 62" fill="none" stroke="url(#ganeshGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Ear -->
  <path d="M63 32 C78 28 86 38 82 52 C79 62 70 65 63 62" fill="none" stroke="url(#ganeshGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Main Face Contour & Trunk (Sond) turning left/right auspiciously -->
  <path d="M42 32 C46 31 54 31 58 32 C59 40 58 50 56 60 C54 70 48 78 40 82 C32 86 24 81 26 73 C28 66 36 67 38 72" 
        fill="none" stroke="url(#ganeshGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Left Tusk (Dant) - Complete -->
  <path d="M38 56 L32 58 L37 61 Z" fill="#FFFDE7"/>

  <!-- Right Tusk (Ekdant - Broken auspiciously) -->
  <path d="M62 56 L66 57.5 L64 59 Z" fill="#FFFDE7"/>

  <!-- Modak / Laddu in hand/trunk curve -->
  <ellipse cx="23" cy="74" rx="4.5" ry="4" fill="url(#ganeshGold)"/>
  <circle cx="23" cy="71" r="1.5" fill="#D50000"/>

  <!-- Auspicious Trishul / Tilak on Forehead -->
  <path d="M47 30 C47 25 48 22 50 20 C52 22 53 25 53 30 Z" fill="url(#tilakRed)"/>
  <path d="M43 27 C47 28 53 28 57 27" stroke="url(#tilakRed)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M44 24 C47 25 53 25 56 24" stroke="url(#tilakRed)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Yellow Chandan dot -->
  <circle cx="50" cy="33" r="2" fill="#FFF176"/>

  <!-- Eyes (Graceful lines) -->
  <path d="M42 39 Q45 42 48 40" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 40 Q55 42 58 39" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
</svg>
