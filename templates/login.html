{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
            <div class="mb-3">
                <i class="fa-solid fa-om fa-4x text-warning"></i>
            </div>
            <h4 class="fw-bold text-danger mb-1">{{ mandal_name }}</h4>
            <p class="text-muted small mb-4">{{ festival_title }}</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-floating mb-3 text-start">
                    <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Username" required>
                    <label for="username"><i class="fa-solid fa-user me-2"></i>वापरकर्ता नाव (Username)</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" required>
                    <label for="password"><i class="fa-solid fa-lock me-2"></i>पासवर्ड (Password)</label>
                </div>
                <button type="submit" class="btn btn-quick-action w-100 py-2 fs-5 rounded-3 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>लॉगिन करा (Login)
                </button>
            </form>

            <div class="alert alert-light border text-start small mt-3 mb-0">
                <div class="fw-bold text-dark mb-1"><i class="fa-solid fa-key me-1 text-warning"></i> टेस्टिंग खाती (Demo Credentials):</div>
                <div class="d-flex justify-content-between my-1">
                    <span><strong>अध्यक्ष/Admin:</strong> admin</span>
                    <code>admin123</code>
                </div>
                <div class="d-flex justify-content-between my-1">
                    <span><strong>खजिनदार/Treasurer:</strong> treasurer</span>
                    <code>treasurer123</code>
                </div>
                <div class="d-flex justify-content-between my-1">
                    <span><strong>सदस्य/Member:</strong> member</span>
                    <code>member123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
